<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Restaurante - Delivery</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f8f9fa; color: #333; }
        header { background: #ff4757; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        .container { padding: 15px; }
        .card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; align-items: center; }
        .card img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; margin-right: 15px; }
        .info { flex-grow: 1; }
        .indisponivel { opacity: 0.5; filter: grayscale(100%); }
        button { background: #ff4757; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>

    <header>🍔 Delícias da Casa</header>

    <div class="container">
        <h2>Cardápio</h2>
        <div id="lista-cardapio">Carregando cardápio...</div>
    </div>

    <!-- Biblioteca do Socket.io para comunicação em tempo real -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        // ATENCAO: Quando subir o backend no Render, troque o link abaixo pelo link do seu servidor do Render
        const socket = io('http://localhost:3000');

        socket.on('atualizar_cardapio', (cardapio) => {
            const container = document.getElementById('lista-cardapio');
            container.innerHTML = '';

            cardapio.forEach(item => {
                const div = document.createElement('div');
                div.className = `card ${item.disponivel ? '' : 'indisponivel'}`;
                div.innerHTML = `
                    <img src="${item.imagem}" alt="${item.nome}">
                    <div class="info">
                        <h3>${item.nome}</h3>
                        <p>R$ ${item.preco.toFixed(2)}</p>
                        <p><strong>${item.disponivel ? 'Disponível ✅' : 'Esgotado ❌'}</strong></p>
                    </div>
                    <button ${!item.disponivel ? 'disabled' : ''} onclick="fazerPedido(${item.id})">Pedir</button>
                `;
                container.appendChild(div);
            });
        });

        function fazerPedido(id) {
            alert('Pedido enviado com sucesso! O restaurante já vai receber.');
            socket.emit('novo_pedido', { produtoId: id, cliente: 'Cliente Teste' });
        }

        // Registra o Service Worker para transformar em PWA instalável
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('PWA configurado com sucesso!'));
        }
    </script>
</body>
</html>
